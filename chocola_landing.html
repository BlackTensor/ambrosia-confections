    <style>
        @keyframes fadeIn {
            from {

                transform: translateY(20px);
            }

            to {

                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(100%);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .animate-slide-in {
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .hero-bg {

            background-position: center;
            background-attachment: fixed;

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .link-underline {
            position: relative;
        }

        .link-underline::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #D4AF37;
            transition: width 0.3s ease;
        }

        .link-underline:hover::after,
        .link-underline.nav-active::after {
            width: 100%;
        }

        /* Navigation visibility fix */
        .nav-link {
            color: #FAF3E0 !important;
        }

        .nav-link:hover,

            color: #D4AF37 !important;
        }

        .header-icon {
            color: #FAF3E0 !important;
        }

        .header-icon:hover {
            color: #D4AF37 !important;
        }

        .logo-text {
            color: #D4AF37 !important;
        }

        .star-btn {
            transition: transform 0.15s ease, color 0.15s ease;
        }

        .star-btn:hover {
            transform: scale(1.15);
        }

        /* Premium gold glow effect */
        .gold-glow {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        /* Smooth carousel transitions */
        .carousel-fade {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        /* Premium button hover states */
        .btn-premium {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-premium:hover {
            transform: translateY(-2px);

        /* Line clamp for descriptions */
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;

        }

        // --- Interactive 5-Star Rating Component ---
        const StarRating = ({ initialRating = 0, onRatingChange, size = 32, readonly = false }) => {
            const [rating, setRating] = useState(initialRating);
            const [hoverRating, setHoverRating] = useState(0);

            const handleClick = (index) => {
                if (readonly) return;
                const newRating = index + 1;
                setRating(newRating);
                if (onRatingChange) onRatingChange(newRating);
            };

            const handleMouseEnter = (index) => {
                if (readonly) return;
                setHoverRating(index + 1);
            };

            const handleMouseLeave = () => {
                if (readonly) return;
                setHoverRating(0);
            };

            const displayRating = hoverRating || rating;

            return (
                <div className="flex gap-1" onMouseLeave={handleMouseLeave}>
                    {[0, 1, 2, 3, 4].map((index) => {
                        const isFilled = index < displayRating;
                        return (
                            <button
                                key={index}
                                onClick={() => handleClick(index)}
                                onMouseEnter={() => handleMouseEnter(index)}
                                className={`star-btn ${readonly ? 'cursor-default' : 'cursor-pointer'}`}
                                disabled={readonly}
                                aria-label={`Rate ${index + 1} stars`}
                            >

                                    height={size}

        // --- Search Overlay ---
        const SearchOverlay = ({ isOpen, onClose, products, onAddToCart, onViewDetails }) => {

            const inputRef = useRef(null);

            useEffect(() => {
                if (isOpen && inputRef.current) {
                    inputRef.current.focus();
                }
            }, [isOpen]);

            const filtered = products.filter(p => p.title.toLowerCase().includes(query.toLowerCase()) || p.desc.toLowerCase().includes(query.toLowerCase()));

            const handleViewDetails = (product) => {
                if (onViewDetails) {
                    onViewDetails(product);
                }
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 bg-cocoa/95 backdrop-blur-md flex flex-col animate-fade-in">
                    <div className="container mx-auto px-6 py-8">

                            <button onClick={onClose} className="text-cream hover:text-gold transition-colors"><X size={28} /></button>
                        </div>
                        <div className="relative mb-8">
                            <SearchIcon className="absolute left-4 top-1/2 -translate-y-1/2 text-white/50" size={24} />
                            <input
                                ref={inputRef}
                                type="text"
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}

        // --- Search Result Card with Image Carousel ---
        const SearchResultCard = ({ product, onViewDetails, onAddToCart }) => {
            const [currentImage, setCurrentImage] = useState(0);
            const [isHovering, setIsHovering] = useState(false);
            const intervalRef = useRef(null);

            const galleryLabels = ['Hero', 'Action', 'Lifestyle'];
            const images = product.gallery || [product.img, product.img, product.img];

            // Auto-cycle images on hover
            useEffect(() => {
                if (isHovering && images.length > 1) {
                    intervalRef.current = setInterval(() => {
                        setCurrentImage(prev => (prev + 1) % images.length);
                    }, 1200);
                } else {
                    if (intervalRef.current) {
                        clearInterval(intervalRef.current);
                    }
                }
                return () => {
                    if (intervalRef.current) clearInterval(intervalRef.current);
                };
            }, [isHovering, images.length]);

            return (
                <div className="bg-white rounded-lg overflow-hidden shadow-lg hover:shadow-2xl transition-all duration-500 hover:-translate-y-2 animate-fade-in group">
                    {/* Image Carousel */}
                    <div
                        className="h-56 overflow-hidden relative cursor-pointer"
                        onMouseEnter={() => setIsHovering(true)}
                        onMouseLeave={() => setIsHovering(false)}
                        onClick={() => onViewDetails && onViewDetails(product)}
                    >
                        {/* Carousel Images with Fade */}
                        {images.map((img, i) => (
                            <img
                                key={i}

                                className={`absolute inset-0 w-full h-full object-cover transition-all duration-500 group-hover:scale-105 ${currentImage === i ? 'opacity-100 z-10' : 'opacity-0 z-0'}`}
                            />

                            <span className="text-gold font-bold uppercase tracking-wider text-sm flex items-center gap-2">
                                <Eye size={16} /> View Details
                            </span>
                        </div>

                        {/* Navigation Dots */}

                            <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2 z-30">
                                {images.map((_, i) => (
                                    <button

                                        className={`h-2.5 rounded-full transition-all duration-300 ${currentImage === i ? 'bg-gold w-6' : 'bg-white/60 hover:bg-white w-2.5'}`}
                                    />

                            </div>

                        {/* Image Label Badge */}
                        <div className="absolute top-3 left-3 bg-cocoa/80 text-gold text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full z-20">
                            {galleryLabels[currentImage] || 'Image'}

                    </div>

                    {/* Product Info */}
                    <div className="p-5 text-center bg-cream/30">
                        <h3
                            className="font-serif text-xl font-bold text-cocoa cursor-pointer hover:text-gold transition-colors"
                            onClick={() => onViewDetails && onViewDetails(product)}
                        >
                            {product.title}
                        </h3>
                        <p className="text-gray-500 font-light text-sm mt-1 line-clamp-2">{product.desc}</p>
                        <p className="text-gold font-serif text-2xl italic mt-3">${product.price.toFixed(2)}</p>
                        <div className="flex gap-3 mt-4 justify-center">
                            <button
                                onClick={() => onViewDetails && onViewDetails(product)}
                                className="bg-transparent border-2 border-cocoa text-cocoa py-2 px-5 font-bold uppercase tracking-wider text-xs hover:bg-cocoa hover:text-cream transition-all rounded"
                            >
                                More Info

                            <button
                                onClick={() => onAddToCart(product)}

                                Add to Cart

                        </div>
                    </div>
                </div>
            );

        // --- Mini Cart Drawer ---
        const MiniCart = ({ isOpen, onClose, cart, updateQuantity, removeFromCart, onCheckout }) => {
            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            const handleCheckout = () => {
                onClose();
                setTimeout(() => onCheckout(), 300);
            };

            return (
                <>
                    {isOpen && <div className="fixed inset-0 bg-black/50 z-40" onClick={onClose}></div>}
                    <div className={`fixed top-0 right-0 h-full w-full max-w-md bg-cocoa z-50 shadow-2xl transform transition-transform duration-300 ease-out ${isOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="flex flex-col h-full">

                            <div className="flex-1 overflow-y-auto p-6 scrollbar-hide">

                                        <ShoppingCart size={64} className="mx-auto text-white/10 mb-6" />

                                        <p className="text-white/30 text-sm">Add some chocolates to get started</p>
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        {cart.map(item => (
                                            <div key={item.id} className="flex gap-4 bg-white/5 rounded-lg p-4 border border-white/10">

                                                <div className="flex-1">
                                                    <h4 className="font-serif text-cream font-bold">{item.title}</h4>
                                                    <p className="text-gold font-bold">${(item.price * item.quantity).toFixed(2)}</p>
                                                    <div className="flex items-center gap-3 mt-2">
                                                        <button onClick={() => updateQuantity(item.id, -1)} className="text-white/50 hover:text-gold"><Minus size={16} /></button>
                                                        <span className="text-cream">{item.quantity}</span>
                                                        <button onClick={() => updateQuantity(item.id, 1)} className="text-white/50 hover:text-gold"><Plus size={16} /></button>
                                                        <button onClick={() => removeFromCart(item.id)} className="ml-auto text-white/30 hover:text-red-400"><Trash size={16} /></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            {cart.length > 0 && (
                                <div className="p-6 border-t border-white/10">
                                    <div className="flex justify-between text-cream mb-4">
                                        <span className="font-bold">Subtotal</span>
                                        <span className="font-serif text-xl text-gold">${total.toFixed(2)}</span>
                                    </div>
                                    <button onClick={handleCheckout} className="w-full bg-gold text-cocoa py-4 font-bold uppercase tracking-widest hover:bg-white transition-colors rounded">Checkout</button>
                                </div>
                            )}
                        </div>
                    </div>
                </>
            );
        };

        // --- Checkout Overlay ---
        const CheckoutOverlay = ({ isOpen, onClose, cart, onComplete, onNavigate }) => {
            const [step, setStep] = useState(1);
            const [isProcessing, setIsProcessing] = useState(false);
            const [orderComplete, setOrderComplete] = useState(false);
            const [orderNumber, setOrderNumber] = useState('');
            const [errors, setErrors] = useState({});

            const [formData, setFormData] = useState({
                email: '',
                fullName: '',
                address: '',
                city: '',
                postalCode: '',
                country: '',
                shippingMethod: 'legendary',
                cardNumber: '',
                cardExpiry: '',
                cardCvc: '',
                cardName: ''
            });

            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const shipping = formData.shippingMethod === 'legendary' ? 0 : 15;
            const grandTotal = total + shipping;

            useEffect(() => {
                if (isOpen) {
                    document.body.style.overflow = 'hidden';
                    setStep(1);
                    setOrderComplete(false);
                    setErrors({});
                } else {
                    document.body.style.overflow = '';
                }
                return () => { document.body.style.overflow = ''; };
            }, [isOpen]);

            const validateStep = (stepNum) => {
                const newErrors = {};
                if (stepNum === 1) {
                    if (!formData.email) newErrors.email = 'Please provide your email address';
                    else if (!/\S+@\S+\.\S+/.test(formData.email)) newErrors.email = 'Please enter a valid email';
                    if (!formData.fullName) newErrors.fullName = 'Your name is required for delivery';
                    if (!formData.address) newErrors.address = 'Delivery address is essential';
                    if (!formData.city) newErrors.city = 'City is required';
                    if (!formData.postalCode) newErrors.postalCode = 'Postal code is required';
                }
                if (stepNum === 3) {
                    if (!formData.cardNumber || formData.cardNumber.replace(/\s/g, '').length < 16) newErrors.cardNumber = 'Valid card number required';
                    if (!formData.cardExpiry) newErrors.cardExpiry = 'Expiry date required';
                    if (!formData.cardCvc || formData.cardCvc.length < 3) newErrors.cardCvc = 'CVC required';
                    if (!formData.cardName) newErrors.cardName = 'Cardholder name required';
                }
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const nextStep = () => {
                if (validateStep(step)) {
                    setStep(step + 1);
                }
            };

            const handleSubmit = () => {
                if (validateStep(3)) {
                    setIsProcessing(true);
                    setTimeout(() => {
                        setIsProcessing(false);
                        setOrderNumber('AMB-' + Date.now().toString().slice(-8));
                        setOrderComplete(true);
                        onComplete();
                    }, 2500);
                }
            };

            const formatCardNumber = (value) => {
                return value.replace(/\s/g, '').replace(/(\d{4})/g, '$1 ').trim().slice(0, 19);
            };

            const handleReturnHome = () => {
                onClose();
                onNavigate('home');
            };

            if (!isOpen) return null;

            // Processing Animation
            if (isProcessing) {
                return (
                    <div className="fixed inset-0 z-[60] bg-cocoa flex items-center justify-center animate-fade-in">
                        <div className="text-center">
                            <div className="w-16 h-16 border-4 border-gold/30 border-t-gold rounded-full animate-spin mx-auto mb-8"></div>
                            <p className="text-gold font-serif text-2xl mb-2">Processing Your Order</p>
                            <p className="text-white/50">Please wait while we secure your indulgence...</p>
                        </div>
                    </div>
                );
            }

            // Order Complete State
            if (orderComplete) {
                return (
                    <div className="fixed inset-0 z-[60] bg-cocoa flex items-center justify-center animate-fade-in">
                        <div className="text-center max-w-lg px-6">
                            <div className="w-24 h-24 bg-gold/20 rounded-full flex items-center justify-center mx-auto mb-8">
                                <CheckCircle size={48} className="text-gold" />
                            </div>
                            <h1 className="font-serif text-4xl md:text-5xl text-gold mb-4">Transcendent Gratitude</h1>
                            <p className="text-cream text-lg mb-8">Your order has been placed with utmost care. Prepare for an extraordinary chocolate experience.</p>
                            <div className="bg-white/5 rounded-lg p-6 border border-white/10 mb-8">
                                <p className="text-white/50 text-sm mb-2">Order Number</p>
                                <p className="text-gold font-mono text-2xl font-bold">{orderNumber}</p>
                            </div>
                            <p className="text-white/40 text-sm mb-8">A confirmation email has been sent to {formData.email}</p>
                            <button
                                onClick={handleReturnHome}
                                className="bg-gold text-cocoa px-10 py-4 font-bold uppercase tracking-widest hover:bg-white transition-all rounded-lg"
                            >
                                Return to Shayan Homepage
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="fixed inset-0 z-[60] bg-cocoa overflow-y-auto animate-fade-in">
                    {/* Header */}
                    <div className="sticky top-0 bg-cocoa/95 backdrop-blur-sm border-b border-white/10 z-10">
                        <div className="container mx-auto px-6 py-4 flex justify-between items-center">
                            <h1 className="font-serif text-2xl text-gold">Checkout</h1>
                            <button onClick={onClose} className="text-cream hover:text-gold transition-colors"><X size={24} /></button>
                        </div>
                        {/* Progress Steps */}
                        <div className="container mx-auto px-6 pb-4">
                            <div className="flex items-center justify-center gap-4 text-sm">
                                {['Contact & Shipping', 'Delivery Method', 'Payment'].map((label, i) => (
                                    <div key={i} className="flex items-center gap-2">
                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold ${step > i + 1 ? 'bg-gold text-cocoa' : step === i + 1 ? 'bg-gold text-cocoa' : 'bg-white/10 text-white/40'}`}>
                                            {step > i + 1 ? <CheckCircle size={16} /> : i + 1}
                                        </div>
                                        <span className={`hidden md:block ${step >= i + 1 ? 'text-cream' : 'text-white/40'}`}>{label}</span>
                                        {i < 2 && <div className={`w-12 h-0.5 ${step > i + 1 ? 'bg-gold' : 'bg-white/10'}`}></div>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="container mx-auto px-6 py-8">
                        <div className="grid lg:grid-cols-3 gap-10">
                            {/* Form Section */}
                            <div className="lg:col-span-2">
                                {/* Step 1: Contact & Shipping */}
                                {step === 1 && (
                                    <div className="animate-fade-in">
                                        <h2 className="font-serif text-3xl text-cream mb-8">Contact & Shipping</h2>
                                        <div className="space-y-6">
                                            <div>
                                                <label className="block text-cream mb-2 font-medium">Email Address</label>
                                                <input
                                                    type="email"
                                                    value={formData.email}
                                                    onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                                                    placeholder="your.exquisite.taste@email.com"
                                                    className={`w-full bg-white/5 border ${errors.email ? 'border-red-400' : 'border-white/20'} rounded-lg px-4 py-4 text-cream placeholder-white/30 focus:outline-none focus:border-gold transition-colors`}
                                                />
                                                {errors.email && <p className="text-red-400 text-sm mt-2">{errors.email}</p>}
                                            </div>
                                            <div>
                                                <label className="block text-cream mb-2 font-medium">Full Name</label>
                                                <input
                                                    type="text"
                                                    value={formData.fullName}

                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);

                });
                setNotification({ show: true, message: `Added ${product.title} to cart` });
                setTimeout(() => setNotification({ show: false, message: '' }), 3000);
            };

            const updateQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : item;
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            const navigate = (page) => {
                setCurrentPage(page);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const openProductDetail = (product) => {
                setScrollPosition(window.scrollY);
                setSelectedProduct(product);
            };

            const closeProductDetail = () => {
                setSelectedProduct(null);
                setTimeout(() => {
                    window.scrollTo({ top: scrollPosition, behavior: 'instant' });
                }, 10);
            };

            const renderPage = () => {
                switch (currentPage) {
                    case 'shop': return <ShopPage onAddToCart={addToCart} onViewDetails={openProductDetail} />;
                    case 'story': return <StoryPage />;
                    case 'gifts': return <GiftsPage onAddToCart={addToCart} onViewDetails={openProductDetail} />;
                    case 'contact': return <ContactPage />;
                    case 'faq': return <FAQPage />;
                    case 'shipping': return <ShippingPage />;
                    case 'subscriptions': return <SubscriptionsPage />;
                    default: return (
                        <>
                            <Hero onNavigate={navigate} />
                            <FeaturedSection onAddToCart={addToCart} onNavigate={navigate} onViewDetails={openProductDetail} />
                            <Testimonials />
                            <CustomerReviews />
                        </>
                    );
                }
            };

            return (
                <div className="min-h-screen">
                    <Notification show={notification.show} message={notification.message} />
                    <SearchOverlay isOpen={isSearchOpen} onClose={() => setIsSearchOpen(false)} products={allProducts} onAddToCart={addToCart} onViewDetails={openProductDetail} />
                    <MiniCart isOpen={isCartOpen} onClose={() => setIsCartOpen(false)} cart={cart} updateQuantity={updateQuantity} removeFromCart={removeFromCart} onCheckout={() => setIsCheckoutOpen(true)} />
                    <CheckoutOverlay isOpen={isCheckoutOpen} onClose={() => setIsCheckoutOpen(false)} cart={cart} onComplete={() => setCart([])} onNavigate={navigate} />
                    <ProductDetail product={selectedProduct} isOpen={!!selectedProduct} onClose={closeProductDetail} onAddToCart={addToCart} />
                    <Header cartCount={cartCount} onSearchClick={() => setIsSearchOpen(true)} onCartClick={() => setIsCartOpen(true)} onNavigate={navigate} currentPage={currentPage} />
                    {renderPage()}
                    <Footer onNavigate={navigate} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
