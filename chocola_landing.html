        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(100%);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .animate-slide-in {
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .hero-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1511381939415-e44015466834?q=80&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .story-bg {
            background-image: linear-gradient(rgba(62, 39, 35, 0.85), rgba(62, 39, 35, 0.9)), url('https://images.unsplash.com/photo-1606312619070-d48b7065e1b0?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .link-underline {
            position: relative;
        }

        .link-underline::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--color-gold);
            transition: width 0.3s ease;
        }

        .link-underline:hover::after,
        .link-underline.nav-active::after {
            width: 100%;
        }

        /* Navigation visibility fix */
        .nav-link {
            color: inherit !important;
        }

        .nav-link:hover,
        .nav-link.nav-active {
            color: var(--color-gold) !important;
        }

        .header-icon {
            color: inherit !important;
        }

        .header-icon:hover {
            color: var(--color-gold) !important;
        }

        .logo-text {
            color: var(--color-gold) !important;
        }

        .star-btn {
            transition: transform 0.15s ease, color 0.15s ease;
        }

        .star-btn:hover {
            transform: scale(1.15);
        }

        .gold-glow {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .carousel-fade {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        .btn-premium {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-premium:hover {
            transform: translateY(-2px);

            display: -webkit-box;
            -webkit-line-clamp: 1;
            line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        * {
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;

</head>

        // --- Star Rating Component ---
        const StarRating = ({ initialRating = 0, onRatingChange, size = 32, readonly = false }) => {
            const [rating, setRating] = useState(initialRating);
            const [hoverRating, setHoverRating] = useState(0);

            const handleClick = (index) => {
                if (readonly) return;
                setRating(index + 1);
                if (onRatingChange) onRatingChange(index + 1);
            };

            const displayRating = hoverRating || rating;

            return (
                <div className="flex gap-1" onMouseLeave={() => !readonly && setHoverRating(0)}>
                    {[0, 1, 2, 3, 4].map((index) => (
                        <button
                            key={index}
                            onClick={() => handleClick(index)}
                            onMouseEnter={() => !readonly && setHoverRating(index + 1)}
                            className={`star-btn ${readonly ? 'cursor-default' : 'cursor-pointer'}`}
                            disabled={readonly}

        const SearchOverlay = ({ isOpen, onClose, products, onAddToCart, onViewDetails }) => {
            const [query, setQuery] = useState('');
            if (!isOpen) return null;
            const filtered = products.filter(p => p.title.toLowerCase().includes(query.toLowerCase()));

            return (
                <div className="fixed inset-0 z-50 bg-[#3E2724]/98 backdrop-blur-md animate-fade-in p-8">
                    <div className="container mx-auto">
                        <div className="flex justify-between items-center mb-12">
                            <h2 className="font-serif text-4xl text-gold">Search Our Atelier</h2>
                            <button onClick={onClose} className="text-cream hover:text-gold"><X size={32} /></button>
                        </div>
                        <input
                            autoFocus
                            type="text"
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                            placeholder="Discover chocolates..."
                            className="w-full bg-white/5 border-b-2 border-gold py-6 text-3xl text-cream placeholder-white/20 focus:outline-none"
                        />
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mt-12 max-h-[60vh] overflow-y-auto scrollbar-hide">
                            {filtered.map(p => (
                                <div key={p.id} className="bg-white/5 p-4 rounded-xl border border-white/10 flex gap-4 cursor-pointer hover:bg-white/10" onClick={() => onViewDetails(p)}>
                                    <img src={p.img} className="w-20 h-20 object-cover rounded" />
                                    <div>
                                        <h4 className="text-cream font-bold">{p.title}</h4>
                                        <p className="text-gold">${p.price.toFixed(2)}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Header ---
        const Header = ({ darkMode, toggleTheme, cartCount, onSearchClick, onCartClick, onNavigate, currentPage }) => {
            const [isScrolled, setIsScrolled] = useState(false);
            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <header className={`fixed w-full top-0 z-40 transition-all duration-300 ${isScrolled || currentPage !== 'home' ? 'bg-cocoa shadow-lg py-4' : 'bg-transparent py-8'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <button onClick={() => onNavigate('home')} className="logo-text font-serif text-3xl font-bold tracking-widest text-[#D4AF37]">Ambrosia & Co.</button>

                        <nav className="hidden md:flex gap-10 font-medium tracking-widest uppercase text-xs">
                            {['shop', 'story', 'gifts', 'contact'].map(page => (
                                <button key={page} onClick={() => onNavigate(page)} className={`nav-link link-underline ${currentPage === page ? 'nav-active' : ''}`}>{page}</button>
                            ))}
                        </nav>

                        <div className="flex items-center gap-8">
                            <button onClick={toggleTheme} className="header-icon hover:rotate-12 transition-transform">
                                {darkMode ? <Sun size={20} /> : <Moon size={20} />}
                            </button>
                            <button onClick={onSearchClick} className="header-icon"><SearchIcon size={20} /></button>
                            <button onClick={onCartClick} className="header-icon relative">
                                <ShoppingCart size={20} />
                                {cartCount > 0 && <span className="absolute -top-3 -right-3 bg-gold text-cream text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-cocoa">{cartCount}</span>}
                            </button>
                        </div>
                    </div>
                </header>
            );
        };

        // --- App Component ---
        const App = () => {
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('ambrosia-theme');
                return saved ? saved === 'dark' : true;
            });
            const [currentPage, setCurrentPage] = useState('home');
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isSearchOpen, setIsSearchOpen] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [notification, setNotification] = useState({ show: false, message: '' });

            useEffect(() => {
                const body = document.body;
                if (darkMode) {
                    body.classList.remove('light-mode');
                    localStorage.setItem('ambrosia-theme', 'dark');
                } else {
                    body.classList.add('light-mode');
                    localStorage.setItem('ambrosia-theme', 'light');
                }
            }, [darkMode]);

            const onAddToCart = (product, quantity = 1) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + quantity } : item);
                    return [...prev, { ...product, quantity }];
                });
                setNotification({ show: true, message: `Added ${product.title} to your treasure.` });
                setTimeout(() => setNotification({ show: false, message: '' }), 3000);
            };

            return (
                <div className={`min-h-screen transition-colors duration-500`}>
                    <Header
                        darkMode={darkMode}
                        toggleTheme={() => setDarkMode(!darkMode)}
                        cartCount={cart.reduce((s, i) => s + i.quantity, 0)}
                        onSearchClick={() => setIsSearchOpen(true)}
                        onCartClick={() => setIsCartOpen(true)}
                        onNavigate={setCurrentPage}
                        currentPage={currentPage}
                    />

                    <Notification {...notification} />

                    <main>
                        {currentPage === 'home' && (
                            <>
                                <section className="relative h-screen flex items-center justify-center hero-bg text-center px-4">
                                    <div className="relative z-10 max-w-5xl space-y-10 animate-fade-in-up">
                                        <h1 className="font-serif text-6xl md:text-8xl text-cream font-bold leading-tight uppercase tracking-tighter">Experience <span className="text-gold italic normal-case">Legendary</span> Indulgence.</h1>
                                        <p className="text-xl md:text-2xl text-terracotta font-light tracking-widest max-w-3xl mx-auto drop-shadow-md">Handcrafted with the world's most resplendent cacao, exclusively for those who demand transcendence.</p>
                                        <div className="pt-8">
                                            <button onClick={() => setCurrentPage('shop')} className="bg-gold text-white bg-[#3E2723] font-bold py-5 px-14 text-lg uppercase tracking-[0.3em] hover:bg-cream hover:text-[#3E2723] transition-all duration-500 shadow-2xl rounded">Enter the Atelier</button>
                                        </div>
                                    </div>
                                    <div className="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce text-gold opacity-50"><ArrowRight size={32} className="rotate-90" /></div>
                                </section>

                                <section className="py-32 px-6">
                                    <div className="container mx-auto">
                                        <div className="text-center mb-20 animate-fade-in">
                                            <span className="text-gold uppercase tracking-[0.4em] font-bold text-xs">Featured Creations</span>
                                            <h2 className="font-serif text-5xl text-cocoa font-bold mt-4 italic">The Signature Trio</h2>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                                            {allProducts.slice(0, 3).map(p => (
                                                <div key={p.id} className="group cursor-pointer" onClick={() => setSelectedProduct(p)}>
                                                    <div className="relative overflow-hidden aspect-[4/5] rounded-2xl shadow-xl">
                                                        <img src={p.img} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                                        <div className="absolute inset-0 bg-gradient-to-t from-cocoa/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-8">
                                                            <h3 className="text-cream font-serif text-3xl font-bold">{p.title}</h3>
                                                            <p className="text-gold mt-2 font-bold">${p.price.toFixed(2)}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </section>
                            </>
                        )}

                        {currentPage === 'shop' && (
                            <section className="pt-40 pb-32 px-6">
                                <div className="container mx-auto">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-16">
                                        {allProducts.concat(giftBoxes).map(p => (
                                            <div key={p.id} className="group">
                                                <div className="relative aspect-square overflow-hidden rounded-2xl mb-6 shadow-2xl bg-white/5 cursor-pointer" onClick={() => setSelectedProduct(p)}>
                                                    <img src={p.img} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                                                </div>
                                                <h3 className="font-serif text-2xl text-cocoa font-bold mb-2">{p.title}</h3>
                                                <p className="text-text-muted text-sm mb-4 line-clamp-1">{p.desc}</p>
                                                <div className="flex justify-between items-center">
                                                    <span className="text-gold font-serif text-2xl font-bold">${p.price.toFixed(2)}</span>
                                                    <button onClick={() => onAddToCart(p)} className="bg-cocoa text-cream px-6 py-3 rounded-full text-xs font-bold uppercase tracking-wider hover:bg-gold transition-colors">Add to Cart</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>
                        )}
                    </main>

                    <footer className="bg-cocoa text-cream py-24 px-6 border-t border-white/5">
                        <div className="container mx-auto grid grid-cols-1 md:grid-cols-4 gap-16">
                            <div className="space-y-6">
                                <h4 className="font-serif text-2xl font-bold text-gold">Ambrosia & Co.</h4>
                                <p className="text-sm opacity-60 leading-relaxed font-light">Crafting the impossible since 2015. Every bean tells a story of resplendent passion and artisan mastery.</p>
                            </div>
                            <div>
                                <h5 className="font-bold uppercase tracking-widest text-xs mb-8 text-gold">The Experience</h5>
                                <ul className="space-y-4 text-sm opacity-60">
                                    <li><button className="hover:text-gold transition-colors">Private Tastings</button></li>
                                    <li><button className="hover:text-gold transition-colors">Corporate Gifting</button></li>
                                    <li><button className="hover:text-gold transition-colors">Bespoke Atelier</button></li>
                                </ul>
                            </div>
                            <div>
                                <h5 className="font-bold uppercase tracking-widest text-xs mb-8 text-gold">Contact Us</h5>
                                <p className="text-sm opacity-60 mb-2">London | Paris | New York</p>
                                <p className="text-sm opacity-60">hello@ambrosia.co</p>
                            </div>
                            <div>
                                <h5 className="font-bold uppercase tracking-widest text-xs mb-8 text-gold">Newsletter</h5>
                                <div className="flex border-b border-white/20 pb-2">
                                    <input type="email" placeholder="Patron Email" className="bg-transparent border-none focus:outline-none text-sm w-full placeholder-white/30" />
                                    <button className="text-gold hover:translate-x-1 transition-transform"><ArrowRight size={20} /></button>
                                </div>
                            </div>
                        </div>
                        <div className="container mx-auto mt-20 pt-10 border-t border-white/5 text-[10px] uppercase tracking-[0.5em] text-center opacity-30">
                            &copy; 2026 Ambrosia & Co. | Legend by Shayan Ansari
                        </div>
                    </footer>

                    <ProductDetail
                        product={selectedProduct}
                        isOpen={!!selectedProduct}
                        onClose={() => setSelectedProduct(null)}
                        onAddToCart={onAddToCart}
                    />

                    <SearchOverlay
                        isOpen={isSearchOpen}
                        onClose={() => setIsSearchOpen(false)}
                        products={allProducts}
                        onAddToCart={onAddToCart}
                        onViewDetails={(p) => { setSelectedProduct(p); setIsSearchOpen(false); }}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
